<div style="max-width:840px;margin:0 auto">
  <div class="crumbs">Home / <b>Profile</b></div>
  <div class="page-head"><div><h1>Profile</h1><p>Update your contact details. Role and status are managed by an administrator.</p></div></div>
  <div class="card">
    <div class="card__head"><h3>Details</h3></div>
    <div class="card__body" style="display:flex;flex-direction:column;gap:16px">
      <div class="field"><label>Full name <span class="req">*</span></label><input class="input" [(ngModel)]="name" name="name"></div>
      <div class="field"><label>Email</label><input class="input" [value]="auth.currentUser()?.email" disabled></div>
      <div class="field"><label>Phone</label><input class="input" [(ngModel)]="phone" name="phone" placeholder="+1 202 555 0143"></div>
      <div class="field"><label>Country</label><input class="input" [(ngModel)]="country" name="country"></div>
      <div class="field"><label>Role</label><input class="input" [value]="auth.currentUser()?.roleType" disabled></div>
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-top:16px">
    <button class="btn btn--primary" (click)="save()">Save</button>
  </div>
</div>
