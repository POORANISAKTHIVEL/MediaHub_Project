server.port=8761
spring.application.name=mediahub-eureka-server

# ── Eureka Server Config ──────────────────────────────────────────
# Do NOT register itself as a client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Eureka server URL (self-reference)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Instance hostname
eureka.instance.hostname=localhost

# Lease settings (seconds)
eureka.server.eviction-interval-timer-in-ms=5000
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
