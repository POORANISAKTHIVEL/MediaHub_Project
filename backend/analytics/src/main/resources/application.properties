server.port=8098
spring.application.name=mediahub-analytics

# ── JWT shared with IAM ──────────────────────────────────────────────────────
jwt.secret=mediahub_iam_secret_key_2025_must_be_32_chars_min
jwt.expiry=1800000

# ── Downstream Service URLs ────────────────────────────────────────────────────
contentcatalog.base-url=http://localhost:8093
subscription.base-url=http://localhost:8086
editorial.base-url=http://localhost:9097
licensing.base-url=http://localhost:8083
royalty.base-url=http://localhost:8045
notification.base-url=http://localhost:8085
iam.base-url=http://localhost:8091

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# -- Eureka Client -------------------------------------------------
spring.application.name=mediahub-analytics
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
