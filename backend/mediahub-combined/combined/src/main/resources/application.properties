# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=mediahub-iam
server.port=8091

# ── Database (shared by both IAM and AuditLog) ───────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mediahub_iam?zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.mediahub.config.TableSnakeColumnCamelStrategy
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=mediahub_iam_secret_key_2025_must_be_32_chars_min
jwt.expiry=1800000

# ── Admin Credentials ─────────────────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@mediahub.com}
app.admin.password=${ADMIN_PASSWORD:$2b$12$adminHash001}
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.phone=${ADMIN_PHONE:+91-9000000001}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.mediahub=DEBUG

# -- Eureka Client -------------------------------------------------
#spring.application.name=mediahub-iam-iam
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# -- Circuit Breaker (Resilience4j) -------------------------------------------------
# Main circuit breaker configuration
resilience4j.circuitbreaker.instances.externalServiceBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalServiceBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.externalServiceBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.externalServiceBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.externalServiceBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.externalServiceBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.externalServiceBreaker.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.externalServiceBreaker.slow-call-duration-threshold=2s

# Enable detailed metrics
management.endpoints.web.exposure.include=health,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
