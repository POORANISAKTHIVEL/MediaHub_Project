spring.application.name=mediahub-royalty
spring.datasource.url=jdbc:mysql://localhost:3306/mediahub_royalty?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8045

# JWT Configuration
jwt.secret=mediahub_iam_secret_key_2025_must_be_32_chars_min
jwt.allowed.issuers=http://localhost:8761

# ── Downstream Service URLs ───────────────────────────────────────────────────
contentcatalog.service.url=http://localhost:8093
licensing.service.url=http://localhost:8083
editorial.service.url=http://localhost:9097
subscription.service.url=http://localhost:8086
notification.service.url=http://localhost:8085


# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.mediahub.royalty=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/royalty.log
logging.file.max-size=10MB
logging.file.max-history=10


# -- Eureka Client -------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
