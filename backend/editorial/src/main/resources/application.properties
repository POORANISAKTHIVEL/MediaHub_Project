spring.datasource.url=jdbc:mysql://localhost:3306/mediahub_editorial?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=9097

management.endpoints.web.exposure.include=health,info,metrics,loggers,env
management.endpoint.health.show-details=always
logging.level.root=INFO
logging.level.com.mediahub.editorial=DEBUG

# Log file output outside src/main
LOG_PATH=logs

# Notification service configuration
notification.service.url=http://localhost:8085

# JWT token validation (must match auth server secret)
jwt.secret=mediahub_iam_secret_key_2025_must_be_32_chars_min
jwt.allowed.issuers=http://localhost:8091,http://localhost:8094

# IAM Service configuration (for token generation if needed)
iam.service.url=http://localhost:8091

# Audit log service configuration
audit.service.url=http://localhost:8091
# -- Eureka Client -------------------------------------------------
spring.application.name=mediahub-editorial
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
