spring.datasource.url=jdbc:mysql://localhost:3306/mediahub_content

spring.datasource.username=root
spring.datasource.password=root


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8093

# JWT token validation (must match auth server secret)
jwt.secret=mediahub_iam_secret_key_2025_must_be_32_chars_min
jwt.allowed.issuers=http://localhost:8091,http://localhost:8094

# Audit log service configuration
audit.service.url=http://localhost:8091

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# -- Eureka Client -------------------------------------------------
spring.application.name=mediahub-content
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
