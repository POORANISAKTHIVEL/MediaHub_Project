server.port=8094
spring.application.name=mediahub-gateway

# -- Downstream Service URLs ---------------------------------------
iam.url=http://localhost:8091
contentcatalog.url=http://localhost:8093
subscription.url=http://localhost:8086
licensing.url=http://localhost:8083
editorial.url=http://localhost:9097
royalty.url=http://localhost:8045
notification.url=http://localhost:8085
analytics.url=http://localhost:8098

# -- Backward compat (mediahub.url still maps to IAM) -------------
mediahub.url=http://localhost:8091

# -- Actuator -----------------------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# -- Eureka Client -------------------------------------------------
#spring.application.name=mediahub-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
