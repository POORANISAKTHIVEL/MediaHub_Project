spring.application.name=mediahub-subscription



# Server Port
server.port=8086


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mediahub_subscription

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO

logging.level.com.mediahub.subscriptionPlan=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true


# JWT token validation (must match auth server secret)
jwt.secret=mediahub_iam_secret_key_2025_must_be_32_chars_min
jwt.allowed.issuers=http://localhost:8091,http://localhost:8094

# Audit log service configuration
audit.service.url=http://localhost:8091
info.app.name=Subscription Plan Service
info.app.version=1.0
info.app.description=MediaHub Subscription Plan Microservice


# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html




# -- Eureka Client -------------------------------------------------
#spring.application.name=mediahub-subscription-subscription
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
